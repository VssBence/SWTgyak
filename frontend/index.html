<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RushHour CCTV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="cicakep.png" type="image/png">
</head>
<body>
    
    <div class="game-container">
        
        <!-- BAL OLDAL: VIDEÓ -->
        <div class="video-panel">
            <h3 id="status_text" style="display: none;"></h3>
            
            <div id="video_sec">
                <span class="video-placeholder">Várakozás a tétre</span>
            </div>

            <div id="liveStatsBox">
                <div class="live-stats-row">
                    <span class="live-stats-label">Áthaladt járművek</span>
                    <span class="live-stats-value" id="liveCountValue">0</span>
                </div>
                <div class="live-progress">
                    <div class="live-progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div id="countdown">00:00</div>
        </div>

        <!-- JOBB OLDAL: VEZÉRLÉS -->
        <div class="control-panel">
            <img src="cicakep.png" alt="Cica" style="width: 100px; display: block; margin: 0 auto;">
            <h1>RushHour CCTV</h1>
            
            <div class="balance-board">
                Egyenleg: <span class="balance-amount" id="balanceDisplay">1000</span> 🪙
            </div>

            <div class="bet-group">
                <label>Tét (🪙):</label>
                <input type="number" id="betAmount" value="100" min="10" step="10">
            </div>

            <div class="bet-group" id="estimateGroup" style="display: none;">
                <label>Rendszer becslés:</label>
                <div id="estimateDisplay" class="estimate-display">–</div>
            </div>

            <div class="bet-group" id="bucketGroup" style="display: none;">
                <label>Válassz fogadást:</label>
                <div id="bucketGrid" class="bucket-grid"></div>
            </div>

            <div id="betTimer" class="bet-timer" style="display: none;">
                Fogadási idő: <span id="betTimerValue">–</span>s
            </div>

            <button type="button" id="loadCamBtn">📷 Helyzet betöltése</button>
            <div id="resultMessage"></div>
        </div>

    </div>
    
    <script src="app.js"></script>
</body>
</html>
