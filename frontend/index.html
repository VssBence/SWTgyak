<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RushHour CCTV</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="cicakep.png" type="image/png">
</head>
<body>
    
    <div class="game-container">
        
        <!-- BAL OLDAL: VIDEÓ -->
        <div class="video-panel">

            <!-- HIBAJELZŐ BADGE (új) -->
            <div id="errorBadge" class="error-badge" style="display: none;">
                <span class="error-dot"></span>
                <span id="errorText">Kapcsolódás sikertelen</span>
                <button type="button" id="retryBtn" class="retry-inline">Újrapróbálás</button>
            </div>

            <h3 id="status_text" style="display: none;"></h3>
            
            <div id="video_sec">
                <!-- Javított placeholder: ikon + szöveg -->
                <div class="video-placeholder">
                    <div class="placeholder-icon">🎥</div>
                    <div class="placeholder-title">Várakozás az indításra</div>
                    <div class="placeholder-sub">Nyomj az Indítás gombra<br>a játék megkezdéséhez</div>
                </div>
            </div>

            <div id="liveStatsBox">
                <div class="live-stats-row">
                    <span class="live-stats-label">Áthaladt járművek</span>
                    <span class="live-stats-value" id="liveCountValue">0</span>
                </div>
                <div class="live-progress">
                    <div class="live-progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div id="countdown">00:00</div>
        </div>

        <!-- JOBB OLDAL: VEZÉRLÉS -->
        <div class="control-panel">
            <div class="brand-header">
                <img src="cicakep.png" alt="Cica" class="brand-logo">
                <div class="brand-info">
                    <h1>RushHour CCTV</h1>
                </div>
            </div>
            
            <div class="balance-board">
                <span class="balance-label">Egyenleg</span>
                <span class="balance-amount" id="balanceDisplay">1000</span>
                <span class="balance-coin">🪙</span>
            </div>

            <!-- TÉT SZEKCIÓ -->
            <div class="bet-group">
                <label>Tét összege (🪙):</label>

                <!-- Gyors választó gombok -->
                <div class="bet-presets" id="betPresets">
                    <button type="button" class="preset-btn" data-value="10">10</button>
                    <button type="button" class="preset-btn" data-value="50">50</button>
                    <button type="button" class="preset-btn" data-value="100">100</button>
                    <button type="button" class="preset-btn" data-value="max">Max</button>
                </div>

                <!-- Stepper + input sor -->
                <div class="bet-input-row">
                    <button type="button" id="betMinus" class="bet-stepper">−</button>
                    <input type="number" id="betAmount" value="100" min="10" step="10">
                    <button type="button" id="betPlus" class="bet-stepper">+</button>
                </div>

                <!-- Min/Max jelzők -->
                <div class="bet-limits">
                    <span>Min: 10 🪙</span>
                    <span>Max: <span id="maxBetDisplay">1000</span> 🪙</span>
                </div>
            </div>

            <div class="bet-group" id="bucketGroup" style="display: none;">
                <label>Válassz fogadást:</label>
                <div id="bucketGrid" class="bucket-grid"></div>
            </div>

            <div id="betTimer" class="bet-timer" style="display: none;">
                ⏱ Fogadási idő: <span id="betTimerValue">–</span>s
            </div>

            <button type="button" id="loadCamBtn">▶ Indítás</button>

            <div id="resultMessage"></div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
