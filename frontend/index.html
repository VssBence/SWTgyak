<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RushHour CCTV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="game-container">
        
        <!-- BAL OLDAL: VIDEÓ -->
        <div class="video-panel">
            <h3 id="status_text" style="display: none;"></h3>
            
            <div id="video_sec">
                <span class="video-placeholder">Várakozás a tétre</span>
            </div>
            
            <div id="countdown">00:00</div>
        </div>

        <!-- JOBB OLDAL: VEZÉRLÉS -->
        <div class="control-panel">
            <h1>RushHour CCTV</h1>
            
            <div class="balance-board">
                Egyenleg: <span class="balance-amount" id="balanceDisplay">1000</span> 🪙
            </div>

            <div class="bet-group">
                <label>Tét (🪙):</label>
                <input type="number" id="betAmount" value="100" min="10" step="10">
            </div>

            <div class="bet-group">
                <label>Tippelt autók száma:</label>
                <input type="number" id="guessNumber" value="5" min="0">
            </div>

            <div class="bet-group">
                <label>Típus:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="guessType" value="min">
                        <span>Kevesebb, mint</span>
                        <span class="multiplier">2x</span>
                    </label>
                    <label>
                        <input type="radio" name="guessType" value="exact" checked>
                        <span>Pontosan ennyi</span>
                        <span class="multiplier">5x</span>
                    </label>
                    <label>
                        <input type="radio" name="guessType" value="max">
                        <span>Több, mint</span>
                        <span class="multiplier">2x</span>
                    </label>
                </div>
            </div>

            <button type="button" id="loadCamBtn">📷 Helyzet betöltése</button>
            <button type="button" id="startBtn" style="display: none;">Fogadás & Videó Indítása</button>
            <div id="resultMessage"></div>
        </div>

    </div>
    
    <script src="app.js"></script>
</body>
</html>
